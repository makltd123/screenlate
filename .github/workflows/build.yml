name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Fetch the model for tests
        run: |
          url=$(grep -oP '^screenlate.modelUrl=\K.*' gradle.properties)
          sha=$(grep -oP '^screenlate.modelSha256=\K.*' gradle.properties)
          curl -sSfL -o "$RUNNER_TEMP/model.zip" "$url"
          echo "$sha  $RUNNER_TEMP/model.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/model.zip" -d "$RUNNER_TEMP/model"
          grep -m1 "model name" /proc/cpuinfo; grep -o -m1 -E "avx512_vnni|avx_vnni" /proc/cpuinfo || echo "no VNNI: exact int8 comparison will be skipped"
          echo "SCREENLATE_MODEL_DIR=$RUNNER_TEMP/model" >> "$GITHUB_ENV"

      - name: Build the tokenizer library for JVM tests
        run: |
          cmake -S app/src/main/cpp -B "$RUNNER_TEMP/host-native" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/host-native" --target spm_jni -j 4
          echo "SCREENLATE_HOST_NATIVE_DIR=$RUNNER_TEMP/host-native" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SCREENLATE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the release key from secrets."
          else
            echo "::warning::KEYSTORE_BASE64 is not set, the APK is signed with a throwaway debug key and will not update over older installs."
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Name and check the APK
        id: apk
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          name="ScreenLate-$version.apk"
          cp app/build/outputs/apk/release/app-release.apk "$name"
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "apksigner from $build_tools"
          "$build_tools/apksigner" verify --verbose --print-certs "$name"
          echo "Size: $(du -h "$name" | cut -f1)"
          echo "path=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.path }}
          archive: false

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
